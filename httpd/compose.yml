services:
  apache:
    image: httpd:2.4.71-alpine
    container_name: my-apache-app
    restart: unless-stopped
    ports:
      - "8088:80" # http://localhost:8088
    volumes:
      - myapp:/usr/local/apache2/htdocs

volumes:
  myapp:
