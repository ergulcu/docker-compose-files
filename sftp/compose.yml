# SFTP server on port 2222 (user and password from .env).
services:
  openssh-server:
    image: lscr.io/linuxserver/openssh-server:version-10.3_p1-r2
    container_name: openssh-server
    hostname: openssh-server
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "true"
      USER_NAME: ${SFTP_USER:?copy .env.example to .env}
      USER_PASSWORD: ${SFTP_PASSWORD:?copy .env.example to .env}
    volumes:
      - myapp:/config
    ports:
      - "2222:2222"

volumes:
  myapp:
