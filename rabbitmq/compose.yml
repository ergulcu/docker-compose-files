# RabbitMQ with the management UI: http://localhost:15672 (user and password from .env).
# The bitnami/rabbitmq cluster used before is no longer published for free; this is the official image.
services:
  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
